name: Telegram Shorts Bot

on:
  push:
    paths:
      - "*.zip"
  repository_dispatch:
    types: [telegram]

permissions:
  contents: write

jobs:
  unzip:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ekstrak zip
        run: |
          shopt -s nullglob
          for z in *.zip; do
            unzip -o "$z" -x ".github/*" "__MACOSX/*"
            rm "$z"
          done
      - name: Commit hasil ekstrak
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Ekstrak zip otomatis" || echo "Tidak ada perubahan"
          git push

  run:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependency sistem
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Install dependency Python
        run: pip install -r requirements.txt
      - name: Jalankan bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_CHAT_IDS: ${{ secrets.ALLOWED_CHAT_IDS }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UPDATE_JSON: ${{ toJson(github.event.client_payload.update) }}
        run: python bot.py
